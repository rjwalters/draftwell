# Cloudflare Pages configuration
name = "draftwell"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "draftwell-db"
database_id = "8859fa42-907a-4014-97e0-2fffb3d041be"

# R2 bucket binding (document and review content storage)
[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "draftwell-content"

# KV namespace binding (rate limiting)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "08f8937b58104f319651b204d60ea887"

# Workers AI binding (open source models)
[ai]
binding = "AI"

# AI Gateway (route all model calls through gateway for logging/caching/analytics)
# Gateway URL: https://gateway.ai.cloudflare.com/v1/251e6e8626d921603fdc3f0d75576bc6/draftwell
# Create at: dash.cloudflare.com → AI → AI Gateway → "draftwell"

# Environment variables (add secrets via `wrangler secret put`)
#
# Google OAuth (required for "Sign in with Google"; the endpoints degrade
# gracefully with a 503 when unset):
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
# Create a Google Cloud OAuth 2.0 "Web application" client and register the
# authorized redirect URI: https://draftwell.org/api/auth/google/callback
# (add http://localhost:8788/api/auth/google/callback for local dev).
[vars]
APP_NAME = "Draftwell"
AI_GATEWAY = "251e6e8626d921603fdc3f0d75576bc6/draftwell"
